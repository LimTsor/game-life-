<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content=
"width=device-width, initial-scale=1.0"
>
    <title>Geme Life</title>
    <script src=
"https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"
></script>
</head>
<body>
    <script>
        function make_2d_array (cols, rows){ // создать двух мерный список
          let arr = new Array(cols)

          let i = 0;
          while (i < arr.length){
            arr[i] = new Array(rows);
          i++;}
          return arr;
        }


        let grid;
        let next;
        let cols, rows;
        let resolution = 4;
       
       
       
        function setup (){ // случайно заполнить
          createCanvas(800, 800);
          let speed = 10;
          cols = width / resolution;
          rows = height / resolution;
          grid = make_2d_array(cols, rows);
          next = make_2d_array(cols, rows);

          let i = 0;
          while (i < cols){
            let j = 0;
            while (j < rows){

              grid [i][j] = floor(random(2));
            j++;}
          i++;}
        }


        function draw(){ // стереть и нарисовать
          background(0);
         
          speed = Number(document.getElementById("slider").value) * 10 + 1;
          frameRate(speed);

          let i = 0;
          while (i < cols){
            let j = 0;
            while (j < rows){

              let x = i * resolution;
              let y = j * resolution;
              if (grid[i][j] == 1){
                fill(255);
                rect(x, y, resolution-1, resolution-1);
              }
            j++;}
          i++;}

         
          // следующее состояние сетки
          i = 0;
          while (i < cols){
            let j = 0;
            while (j < rows){

              let state = grid[i][j];

              let sum = 0;
              let neighbors = count_neighbors(grid, i, j);  
               // знаю правила игры вовсе не новы
              if (state == 0 && neighbors == 3){ // жизнь
                next[i][j] = 1;
              } else if (state == 1 && (neighbors < 2 || neighbors > 3)){ // смерть
                next[i][j] = 0;
              } else {
                next[i][j] = state;
              }
            j++;}
          i++;}

          let temp = grid;
          grid = next;
          next = temp;
        }


        function count_neighbors (grid, x, y){
          let sum = 0;
          let i = -1;
          while (i < 2){
            let j = -1;
            while (j < 2){

              let col = (x + i + cols) % cols;
              let row = (y + j + rows) % rows;

              sum += grid[col][row];
            j++;}
          i++;}
          sum -= grid[x][y];
          return sum;
        }

        function clean(){
          let i = 0;
          while (i < cols){
            let j = 0;
            while (j < rows){

              grid [i][j] = 0;
            j++;}
          i++;}          
        }
    </script>
  <button onclick="setup()">обновить</button>
  <button onclick="clean()">очистить</button>
  <button onclick="frameRate(0)">остановить</button>
  <input  type="range", min="0", max="10", step="1", id="slider">
</body>
</html>
